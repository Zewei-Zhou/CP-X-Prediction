cfg:
  CENTER_OFFSET_OF_MAP:
  - 30.0
  - 0
  DATA_ROOT: /data/dataset/CP-X/data/waymo
  INFO_FILE:
    test: /data/dataset/CP-X/data/waymo/processed_scenarios_val_infos.pkl
    train: /data/dataset/CP-X/data/waymo/processed_scenarios_training_infos.pkl
  INFO_FILTER_DICT:
    filter_info_by_object_type: &id001
    - TYPE_VEHICLE
    - TYPE_PEDESTRIAN
    - TYPE_CYCLIST
  NUM_OF_SRC_POLYLINES: 768
  NUM_POINTS_EACH_POLYLINE: 20
  OBJECT_TYPE: *id001
  POINT_SAMPLED_INTERVAL: 1
  SAMPLE_INTERVAL:
    test: 1
    train: 1
  SPLIT_DIR:
    test: processed_scenarios_validation
    train: processed_scenarios_training
  VECTOR_BREAK_DIST_THRESH: 1.0
  WITHOUT_HDMAP: false
  batch_size: 8
  decoder_layers: 4
  encoder_layers: 4
  epochs: 1
  log_file: /data/robert/CP-X-Prediction/MTR/Prediction/logging/train_log_v2.txt
  lr: 5.0e-05
  lr_step_freq: 200
  lr_step_gamma: 0.96
  lr_warmup_step: 200
  model_name: MTR
  num_workers: 8
  output_path:
  - /data/robert/CP-X-Prediction/MTR/output/train
  seed: 42
  train_data_path:
  - /data/dataset/CP-X/data/waymo/processed_scenarios_training
  val_data_path:
  - /data/dataset/CP-X/data/waymo/processed_scenarios_validation
  weight_decay: 0.01
