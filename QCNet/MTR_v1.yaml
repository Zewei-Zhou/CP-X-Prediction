model_name: MTR

# Data Config - Waymo Open Motion Dataset
train_data_path: [/data/dataset/CP-X/data/waymo/processed_scenarios_training]
val_data_path: [/data/dataset/CP-X/data/waymo/processed_scenarios_validation]

# Data Subset
train_subset_fraction: 0.5
val_subset_fraction: 1.0

# Model Config
encoder_layers: 4
decoder_layers: 4
num_modalities: 6

# Training Params
seed: 42
batch_size: 16
num_workers: 12
lr: 0.0003         # ← Increased from 0.0001 (more headroom before decay kills it)
weight_decay: 0.01
epochs: 30

# Learning rate scheduler — FIXED
# OLD: lr_step_freq=200 decayed every 200 STEPS → LR hit floor by epoch 3
# NEW: lr_step_freq=15000 decays roughly once per epoch
lr_warmup_step: 2000      # ← Increased (500 was too short for 15K steps/epoch)
lr_step_freq: 15000       # ← CRITICAL FIX: was 200, now ~1 decay per epoch
lr_step_gamma: 0.90       # ← Slightly more aggressive per-step since steps are bigger

# Map processing
max_map_range: 150.0
max_polylines: 256

# Output
output_path: [/data/keith/CP-X-Prediction/QCNet/output]