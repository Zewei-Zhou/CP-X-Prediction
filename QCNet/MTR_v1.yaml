model_name: MTR

# Data Config - Waymo Open Motion Dataset
# Update these paths to match your teammate's processed data location
train_data_path: [/data/dataset/CP-X-Prediction/Waymo/training_processed]
val_data_path: [/data/dataset/CP-X-Prediction/Waymo/validation_processed]

# Data loading options
use_duplicates: true  # Set to true to include duplicate vehicle samples (6x more data)
                       # Set to false to filter duplicates (saves ~83% memory)

# Model Config
encoder_layers: 4  # Number of transformer encoder layers (try 4-8)
decoder_layers: 4  # Number of transformer decoder layers (try 4-8)
# Training Params
seed: 42
batch_size: 128  # Adjust based on GPU memory (reduce if OOM)
num_workers: 8  # Number of data loading workers
lr: 0.0002      # Learning rate
weight_decay: 0.01  # Weight decay for regularization
epochs: 50      # Total training epochs

# Learning rate scheduler
lr_warmup_step: 200   # Steps for learning rate warmup
lr_step_freq: 200    # Frequency of learning rate decay
lr_step_gamma: 0.96     # Learning rate decay factor

# Output
output_path: output_waymo  # Directory to save checkpoints and logs