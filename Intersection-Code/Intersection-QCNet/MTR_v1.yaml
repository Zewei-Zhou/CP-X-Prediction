model_name: MTR

# Data Config - Waymo Open Motion Dataset
# Update these paths to match your teammate's processed data location
train_data_path: [/data/dataset/CP-X/data/waymo/processed_scenarios_training]
val_data_path: [/data/dataset/CP-X/data/waymo/processed_scenarios_validation]

# Data Subset for Pretraining
train_subset_fraction: 0.33 # 1/3 of training data
val_subset_fraction: 1.0

# Model Config
encoder_layers: 4  # Number of transformer encoder layers (try 4-8)
decoder_layers: 4  # Number of transformer decoder layers (try 4-8)

# Training Params
seed: 42
batch_size: 32  # Adjust based on GPU memory (reduce if OOM)
num_workers: 12  # Number of data loading workers
lr: 0.0001      # Learning rate
weight_decay: 0.01  # Weight decay for regularization
epochs: 5      # Total training epochs

# Learning rate scheduler
lr_warmup_step: 500   # Steps for learning rate warmup
lr_step_freq: 200    # Frequency of learning rate decay
lr_step_gamma: 0.98    # Learning rate decay factor

# Output
output_path: [/data/keith/CP-X-Prediction/QCNet/output]  # Directory to save checkpoints and logs